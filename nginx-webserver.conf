# ─── Nginx config untuk SERVER WEB (web.radioku.fm) ──────────────────────────
# Letakkan di: /etc/nginx/sites-available/radioku
# Aktifkan: sudo ln -s /etc/nginx/sites-available/radioku /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name radioku.fm www.radioku.fm;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name radioku.fm www.radioku.fm;

    # SSL — isi path certificate kamu (pakai Certbot/Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/radioku.fm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radioku.fm/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Proxy ke Node.js (port 3000)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";   # penting untuk WebSocket
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;  # biar WebSocket tidak timeout
    }

    # Lindungi endpoint admin dengan basic auth
    location /api/admin/ {
        auth_basic           "RadioKu Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;  # buat dengan: htpasswd -c /etc/nginx/.htpasswd admin
        proxy_pass           http://127.0.0.1:3000;
        proxy_set_header     Host $host;
    }
}
