# ─── Nginx config untuk SERVER STREAMING (streaming.radioku.fm) ───────────────
# Nginx di sini bertugas sebagai SSL terminator untuk SHOUTcast
# SHOUTcast sendiri tetap jalan di port 8000 (HTTP)
# Browser → HTTPS 443 (Nginx) → HTTP 8000 (SHOUTcast)
# Ini penting karena browser modern BLOKIR mixed content (HTTPS web + HTTP stream)

server {
    listen 80;
    server_name streaming.radioku.fm;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name streaming.radioku.fm;

    ssl_certificate     /etc/letsencrypt/live/streaming.radioku.fm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streaming.radioku.fm/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── Proxy audio stream ke SHOUTcast ──────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;

        # Penting untuk streaming audio: matikan buffering
        proxy_buffering    off;
        proxy_cache        off;

        # Header CORS agar bisa dimuat dari domain web berbeda
        add_header 'Access-Control-Allow-Origin' 'https://radioku.fm' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }

    # ── Proxy statistics SHOUTcast (untuk metadata polling dari web server) ──
    location /statistics {
        proxy_pass         http://127.0.0.1:8000/statistics;
        proxy_set_header   Host $host;
        add_header 'Access-Control-Allow-Origin' 'https://radioku.fm' always;
    }
}
